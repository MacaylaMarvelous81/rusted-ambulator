<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rusted Ambulator</title>
</head>
<body>
<h2>Sessions</h2>
<ul>
{% for (id, session) in sessions %}
    <li>
        <span>{{session.steam_name}}'s game</span>
        <form action="/session/{{id}}">
            <input name="passcode" placeholder="Passcode">
            <input type="submit">
        </form>
    </li>
{% endfor %}
</ul>
</body>
</html>
